[project]
name = "inkling2-mini-lab"
version = "0.1.0"
description = "Small experiments with Inkling 2 Mini on one 12 GB GPU: zero-shot CIFAR-10, loop depth, routing, and speed."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "matplotlib>=3.9",
    "gguf>=0.17",
    "huggingface_hub>=0.30",
    "pyarrow>=18.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inklab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
